<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f1f5f9;padding:14px}
.nav{background:#fff;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.05);border:1px solid #e2e8f0}
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);border-radius:16px;padding:20px;color:#fff;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}}
.s{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.05);border:1px solid #e2e8f0}
.s h2{font-size:26px;color:#1e3a8a;font-weight:800}
.s p{font-size:12px;color:#64748b}
.main{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,0.05);border:1px solid #e2e8f0}
.inp{width:100%;padding:11px;border:1.5px solid #e2e8f0;border-radius:10px;outline:none;margin-bottom:10px;background:#f8fafc}
.inp:focus{border-color:#1e3a8a;background:#fff}
.btn{width:100%;padding:11px;background:#1e3a8a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px;text-align:left;color:#64748b;font-size:11px;background:#f8fafc}
td{padding:12px;border-top:1px solid #f1f5f9}
</style>
</head><body>
<div class="nav"><b><i class="fa-solid fa-scale-balanced"></i> VAKIL SATHI</b><button onclick="window.open('https://docs.google.com/spreadsheets/d/1AytArb10KlQq2-RP4PUDdCxS_zvvwPa7_5Pp-0iaNnU/edit')" style="padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0;background:#f8fafc;font-weight:600;cursor:pointer">Open Sheet</button></div>
<div class="hero"><h2 style="font-weight:800">Case Management OS v6.0</h2><p style="font-size:12px;opacity:0.8;margin-top:4px">Enterprise Edition • Live Sync ON • Sheet: 1AytArb10KlQq2...</p></div>
<div class="stats">
<div class="s"><h2 id="tc">4</h2><p>Total Cases</p></div>
<div class="s"><h2>3</h2><p>Today Hearings</p></div>
<div class="s"><h2>98%</h2><p>Success Rate</p></div>
<div class="s"><h2>42</h2><p>Active Clients</p></div>
</div>
<div class="main">
<div class="card"><h4><i class="fa-solid fa-plus"></i> Add New Case</h4>
<input class="inp" id="cnrInput" placeholder="CNR Number">
<input class="inp" id="titleInput" placeholder="Case Title">
<input class="inp" id="courtInput" placeholder="Court">
<input class="inp" id="clientInput" placeholder="Client">
<button class="btn" onclick="addCase()">Add to Sheet</button>
<p id="status" style="text-align:center;margin-top:8px;font-size:12px;font-weight:700"></p>
</div>
<div class="card"><h4>All Cases - Live</h4><input class="inp" id="sInput" placeholder="Search..." onkeyup="filterTable()" style="margin-top:10px"><table><thead><tr><th>CNR</th><th>Title</th><th>Date</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
const SID="1AytArb10KlQq2-RP4PUDdCxS_zvvwPa7_5Pp-0iaNnU";
const CSV="https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv";
function addCase(){
 let c=document.getElementById('cnrInput').value.trim(); if(!c)return alert("CNR dalo");
 document.getElementById('status').innerText="Adding...";
 google.script.run.withSuccessHandler(()=>{document.getElementById('status').innerText="✅ Added!";load();}).saveToYourSheet("CNR",c,document.getElementById('titleInput').value,document.getElementById('courtInput').value,document.getElementById('clientInput').value);
}
function load(){
 fetch(CSV).then(r=>r.text()).then(t=>{
  let rows=t.split("\n").slice(1).filter(x=>x.trim()!='').reverse();
  document.getElementById('tc').innerText=rows.length;
  let tb=document.getElementById('tb'); tb.innerHTML='';
  rows.slice(0,30).forEach(r=>{
   let p=r.split(','); let q=p[2]?p[2].replace(/"/g,''):'-'; let tt=p[3]?p[3].replace(/"/g,''):'-';
   let d=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
   if(q.includes("APNA_CNR")||q.includes("TEST"))return;
   tb.innerHTML+=`<tr><td><span style="background:#e0e7ff;color:#4338ca;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700">${q.substring(0,12)}</span></td><td>${tt.substring(0,22)}</td><td>${d}</td><td><span style="background:#dcfce7;color:#166534;padding:3px 8px;border-radius:10px;font-size:11px">Active</span></td></tr>`;
  });
 });
}
function filterTable(){let f=document.getElementById('sInput').value.toUpperCase();[...document.getElementById('tb').rows].forEach(r=>r.style.display=r.innerText.toUpperCase().includes(f)?'':'none')}
load();
</script>
</body></html>
