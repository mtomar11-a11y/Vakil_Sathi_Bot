<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vakil Sathi - Pro Case Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0b5bff;--bg:#f0f3ff;--card:#ffffff}
*{font-family:'Outfit',sans-serif;box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top, #d6e0ff 0%, var(--bg) 60%);min-height:100vh;padding:12px}
.navbar{background:rgba(255,255,255,0.8);backdrop-filter:blur(12px);padding:14px 20px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(11,91,255,0.12);border:1px solid rgba(255,255,255,0.6);position:sticky;top:12px;z-index:10}
.logo{font-weight:700;font-size:20px;color:var(--primary)}.logo span{color:#111}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.stat-card{background:var(--card);padding:16px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.06), inset 0 1px 0 #fff;transform:perspective(1000px) rotateX(2deg);border:1px solid #fff;transition:0.3s}
.stat-card:hover{transform:perspective(1000px) rotateX(0deg) translateY(-4px);box-shadow:0 20px 40px rgba(11,91,255,0.15)}
.stat-card h2{margin:0;font-size:28px;color:var(--primary)}.stat-card p{margin:4px 0 0 0;color:#666;font-size:13px}
.main-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.08);border:1px solid #fff}
.input-group{position:relative;margin-top:14px}
input{width:100%;padding:15px 14px;border:2px solid #e8ecff;border-radius:12px;font-size:16px;outline:none;transition:0.2s}
input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(11,91,255,0.1)}
.btn{width:100%;padding:14px;background:linear-gradient(180deg, #1a6bff 0%, #0b5bff 100%);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(11,91,255,0.3), inset 0 1px 0 rgba(255,255,255,0.3);margin-top:12px}
.btn:active{transform:scale(0.98)}
.table-wrap{margin-top:20px;overflow:auto;max-height:300px;border:1px solid #eef2ff;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8faff;position:sticky;top:0;padding:10px;text-align:left;color:#555}
td{padding:10px;border-top:1px solid #f0f3ff}
.badge{background:#e8f0ff;color:var(--primary);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:30px;font-size:14px;display:none;z-index:999}
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">VAKIL <span>SATHI</span></div>
  <div style="font-size:12px;background:#111;color:#fff;padding:6px 10px;border-radius:20px">PRO v2.0</div>
</div>

<div class="stats">
  <div class="stat-card"><h2 id="totalCases">--</h2><p>Total Cases</p></div>
  <div class="stat-card"><h2 id="todayDate">--</h2><p>Next Hearing</p></div>
</div>

<div class="main-card">
  <h3 style="margin:0 0 4px 0">Add New Case</h3>
  <p style="margin:0;color:#777;font-size:13px">CNR se direct eCourts data fetch hoga</p>

  <div class="input-group">
    <input type="text" id="cnrInput" placeholder="Ex: SCIN010735182025 / DLHC...">
  </div>
  <button class="btn" onclick="addCase()">+ Add to My Sheet</button>
  <div id="status" style="text-align:center;margin-top:10px;font-size:13px;font-weight:600"></div>

  <div style="display:flex;gap:8px;margin-top:16px">
    <input type="text" id="searchInput" placeholder="🔍 Search case..." onkeyup="filterTable()" style="padding:10px">
  </div>

  <div class="table-wrap">
    <table id="caseTable">
      <thead><tr><th>CNR / Query</th><th>Title</th><th>Date</th></tr></thead>
      <tbody id="tableBody"><tr><td colspan="3" style="text-align:center;color:#999;padding:20px">Loading cases...</td></tr></tbody>
    </table>
  </div>

  <p style="font-size:10px;color:#aaa;text-align:center;margin-top:12px">Sheet ID: 1AytArb... | Auto-Sync ON</p>
</div>

<div id="toast"></div>

<script>
// --- TERE SAARE LINKS YAHA ---
const SHEET_ID = "1AytArb10KlQq2-RP4PUDdCxS_zvvwPa7_5Pp-0iaNnU";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlYM3b3rAPqPZ_9Z310pqDWUIf36iMZ9w0Lx739ljL/exec";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'});

function showToast(msg){let t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

// Case Add - Works on both Phone and Laptop
function addCase(){
  const cnr = document.getElementById('cnrInput').value.trim();
  if(!cnr){ showToast("CNR dalo pehle"); return; }
  document.getElementById('status').innerText = "⏳ Adding...";

  // Agar Apps Script ke andar hai toh google.script.run use karo (100% reliable)
  if(typeof google!== 'undefined' && google.script && google.script.run){
    google.script.run.withSuccessHandler(function(){
      document.getElementById('status').innerText = "✅ Ho gaya!";
      showToast("Sheet me add ho gaya: " + cnr);
      document.getElementById('cnrInput').value='';
      loadCases();
    }).withFailureHandler(()=>{document.getElementById('status').innerText="❌ Error"}).saveToYourSheet("CNR", cnr, cnr+" vs State");
  } else {
    // Agar bahar standalone website hai toh no-cors fetch
    fetch(`${SCRIPT_URL}?cnr=${encodeURIComponent(cnr)}`, {mode:'no-cors'})
   .then(()=>{
      document.getElementById('status').innerText = "✅ Request bhej diya! Sheet check karo";
      showToast("Sheet me add ho gaya");
      document.getElementById('cnrInput').value='';
      setTimeout(loadCases,2000);
    });
  }
}

// Cases Load from Sheet
function loadCases(){
  // Try to load via Apps Script or via public CSV
  const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
  fetch(csvUrl).then(r=>r.text()).then(text=>{
    let rows = text.split('\n').slice(1).reverse(); // latest first
    document.getElementById('totalCases').innerText = rows.length;
    let tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    if(rows.length==0 || rows[0]==''){ tbody.innerHTML='<tr><td colspan=3 style="text-align:center">No cases yet</td></tr>'; return; }
    rows.slice(0,50).forEach(r=>{
      let cols = r.split(',');
      let query = cols[2]? cols[2].replace(/"/g,'') : '-';
      let title = cols[3]? cols[3].replace(/"/g,'') : '-';
      let date = cols[0]? cols[0].replace(/"/g,'').split(' ')[0] : '';
      tbody.innerHTML += `<tr><td><span class="badge">${query}</span></td><td>${title}</td><td>${date}</td></tr>`;
    });
  }).catch(()=>{ document.getElementById('tableBody').innerHTML='<tr><td colspan=3 style="text-align:center">Sheet ko "Anyone with link - Viewer" karo tab yahan dikhega</td></tr>'; });
}

function filterTable(){
  let filter = document.getElementById('searchInput').value.toUpperCase();
  let trs = document.getElementById('tableBody').getElementsByTagName('tr');
  for(let tr of trs){ tr.style.display = tr.innerText.toUpperCase().includes(filter)? '' : 'none'; }
}

loadCases();
</script>
</body>
</html>
