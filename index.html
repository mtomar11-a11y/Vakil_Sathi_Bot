<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vakil Sathi - Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8f9fb;color:#1a2332}
.topbar{height:52px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:2px;font-weight:800;letter-spacing:3px}
.logo b{background:#111;color:white;padding:2px 6px;border-radius:3px}
.search-global{width:420px;height:36px;background:#f1f3f6;border-radius:8px;border:1px solid #e5e7eb;display:flex;align-items:center;padding:0 12px;gap:8px;color:#94a3b8;font-size:13px}
.topbar-right{display:flex;align-items:center;gap:18px;color:#64748b}
.layout{display:flex}
.sidebar{width:220px;background:white;border-right:1px solid #e5e7eb;min-height:calc(100vh - 52px);padding:12px 8px;position:sticky;top:52px}
.side-search{height:34px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;display:flex;align-items:center;padding:0 10px;gap:8px;color:#94a3b8;font-size:13px;margin-bottom:12px}
.menu-title{font-size:11px;font-weight:700;color:#64748b;letter-spacing:0.8px;padding:10px 10px 4px;display:flex;align-items:center;justify-content:space-between}
.menu-item{padding:8px 10px;border-radius:6px;font-size:13px;color:#334155;cursor:pointer;display:flex;align-items:center;gap:8px;margin:2px 0}
.menu-item.active{background:#fff7cc;color:#854d0e;font-weight:600}
.menu-item:hover{background:#f1f5f9}
.main{flex:1;padding:14px 18px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.btn-new{background:#22c55e;color:white;border:0;padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer}
.search-box{height:32px;border:1px solid #e5e7eb;background:white;border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:6px;width:260px;color:#94a3b8;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.stat{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:12px;text-align:center}
.stat label{font-size:10px;color:#64748b;font-weight:600;letter-spacing:0.5px;display:block;margin-bottom:4px}
.stat b{font-size:18px;font-weight:800}
.list-toolbar{height:42px;background:white;border:1px solid #e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin-bottom:12px;color:#94a3b8;font-size:13px}
.case-card{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.case-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.case-title{font-size:14px;font-weight:600;color:#1e40af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.case-meta{font-size:11px;color:#64748b;margin-top:6px;line-height:1.6}
.case-right{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700}
.badge.pending{background:#ffedd5;color:#ea580c;border:1px solid #fed7aa}
.badge.lodged{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.date-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;min-width:110px}
.date-box label{font-size:10px;color:#64748b;display:block}
.date-box b{font-size:12px}
.tentative{background:#dbeafe;color:#1d4ed8;padding:2px 6px;border-radius:10px;font-size:9px;font-weight:700;margin-left:4px}
.tag{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.tag.ss{background:#dcfce7;color:#166534}
.tag.sepi{background:#ffe4e6;color:#be123c}
.juris{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px}
.juris span{color:#64748b;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-box{background:white;width:500px;max-height:92vh;overflow:auto;border-radius:12px;padding:20px}
.modal-box label{font-size:11px;font-weight:800;color:#334155;margin-top:8px;display:block}
.modal-box input,.modal-box select{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
.canvas-captcha{height:44px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}
.btn{padding:10px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.btn-primary{background:#1565d8;color:white}
.btn-outline{background:white;border:1px solid #cbd5e1}
</style>
</head>
<body>

</html>
