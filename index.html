<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vakil Sathi - Premium Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f4f5f7;color:#1e293b}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:30;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.logo{font-weight:800;font-size:18px;display:flex;gap:6px;align-items:center}
.logo b{background:#1e40af;color:#fff;padding:3px 10px;border-radius:6px}
.search-global{width:420px;height:38px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;display:flex;align-items:center;padding:0 14px;gap:10px;color:#94a3b8;font-size:13.5px}
.layout{display:flex}
.sidebar{width:240px;background:#fff;border-right:1px solid #e2e8f0;min-height:calc(100vh - 56px);padding:16px 12px}
.menu-item{padding:9px 12px;border-radius:8px;font-size:13.5px;color:#334155;margin:2px 0;cursor:pointer;font-weight:500}
.menu-item.active{background:#dbeafe;color:#1e40af;font-weight:700;border:1px solid #bfdbfe}
.main{flex:1;padding:20px 24px}
.toolbar{display:flex;justify-content:space-between;margin-bottom:18px}
.btn-new{background:#16a34a;color:#fff;border:0;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center}
.stat label{font-size:10px;color:#64748b;font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase}
.stat b{font-size:20px;font-weight:800}
.case-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.badge{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:800}
.badge.pending{background:#ffedd5;color:#c2410c;border:1px solid #fed7aa}
.badge.lodged{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-box{background:#fff;width:560px;max-height:92vh;overflow:auto;border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box label{font-size:11px;font-weight:800;color:#334155;margin-top:14px;display:block;text-transform:uppercase}
.modal-box input,.modal-box select{width:100%;padding:11px 12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:10px;font-size:13.5px}
.btn{padding:11px;border-radius:10px;border:0;font-weight:700;cursor:pointer;font-size:13.5px}
.btn-primary{background:#2563eb;color:#fff}
.btn-outline{background:#fff;border:1px solid #cbd5e1;color:#334155}
</style>
</head>
<body>
<div class="topbar">
<div style="display:flex;align-items:center;gap:16px"><span>☰</span><div class="logo">⚖️ <span>Vakil</span><b>Sathi</b></div><div class="search-global">🔍 Khojo - Cases, Clients, Dates</div></div>
<div style="display:flex;gap:18px;align-items:center;color:#64748b"><span>MT</span></div>
</div>
<div class="layout">
<div class="sidebar">
<div style="height:36px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;display:flex;align-items:center;padding:0 12px;color:#94a3b8;font-size:13px;margin-bottom:16px">🔍 Search menu</div>
<div style="font-size:11px;font-weight:700;color:#64748b;padding:14px 10px 6px">CASES</div>
<div class="menu-item active">📂 Workspace</div>
<div class="menu-item">📅 Daily Causelist</div>
<div class="menu-item">📄 Orders by Date</div>
<div class="menu-item">🔔 Orders by Notification</div>
</div>
<div class="main">
<div class="toolbar"><div style="display:flex;gap:10px"><button class="btn-new" onclick="openModal()">+ New Case</button></div><div style="font-size:13px;color:#94a3b8">Filters</div></div>
<div class="stats">
<div class="stat"><label>Total Cases</label><b id="total">317</b></div><div class="stat"><label>Pending</label><b>291</b></div><div class="stat"><label>Disposed</label><b>21</b></div><div class="stat"><label>Not Available</label><b>5</b></div><div class="stat"><label>Last Week</label><b>1</b></div><div class="stat"><label>Custom</label><b>0</b></div>
</div>
<div id="caseList"></div>
</div>
</div>

<div class="modal" id="modal"><div class="modal-box">
<h3 style="font-size:18px;font-weight:800">Add New Case</h3><p style="font-size:12px;color:#64748b;margin-bottom:18px">Copyright-safe Vakil Sathi design + New Google Link</p>

<label>1. CNR NUMBER * (Sabse Upar)</label>
<input id="cNo" placeholder="DLHC01-000001-2024">
<div style="display:flex;gap:10px;margin-top:10px"><button onclick="generateCaptcha()" class="btn btn-primary" style="flex:1">🔍 Fetch + Captcha</button><span id="fetchStatus" style="font-size:11px;color:#64748b;display:flex;align-items:center"></span></div>

<div id="captchaBox" style="display:none;margin-top:14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:16px;text-align:center">
<canvas id="captchaCanvas" width="180" height="48" style="border:1px solid #e2e8f0;border-radius:10px;background:#fff"></canvas><br>
<div style="display:flex;justify-content:center;gap:8px;margin-top:12px"><input id="captchaInput" placeholder="CODE" style="width:120px;margin:0;text-align:center;letter-spacing:3px;font-weight:700"><button onclick="verifyCaptcha()" class="btn btn-primary" style="background:#16a34a;padding:10px 16px">✓ Verify</button><button onclick="generateCaptcha()" style="padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff">↻</button></div>
</div>

<div style="height:1px;background:#f1f5f9;margin:18px 0"></div>
<div style="text-align:center;font-size:10px;color:#94a3b8;font-weight:800;letter-spacing:1px">OR ENTER MANUALLY</div>

<label>2. SELECT COURT</label>
<select id="cCourtSelect" onchange="updateCaseTypes()"><option value="">-- Court Select --</option><option>Supreme Court of India</option><option>Delhi High Court</option><option>Bombay High Court</option><option>Tis Hazari Court, Delhi</option><option>Patna District Court</option></select>

<label>3. CASE TYPE</label>
<select id="cCaseType"><option value="">-- Pehle Court Select --</option></select>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>4. CASE NUMBER</label><input id="cNumberOnly" placeholder="476"></div><div><label>5. YEAR</label><input id="cYear" type="number" value="2024"></div></div>

<div style="height:1px;background:#f1f5f9;margin:18px 0"></div>

<label>CLIENT / TITLE</label><input id="cClient" placeholder="Auto from Sheet">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>DIARY NUMBER</label><input id="cDiary"></div><div><label>JUDGE / BENCH</label><input id="cJudge"></div></div>
<label>NEXT DATE</label><input id="cDate" type="date">

<div style="display:flex;gap:12px;margin-top:22px"><button class="btn btn-primary" style="flex:1" onclick="saveCase()">💾 Save Case</button><button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button></div>
</div></div>

<script>
// ====== TERA NAYA LINK YAHAN ADD KIYA HAI ======
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzlYM3b3rAPqPZ_9Z310pqDWUIf36iMZ9w0Lx739ljL/dev";

const caseTypeMap={"Supreme Court of India":["Writ Petition (..476 / 2012)","SLP (Criminal) 8357 / 2017","SLP(C)","Diary No."],"Delhi High Court":["W.P.(C)","CRL.A.","CS(OS)","FAO"],"default":["Civil Suit","Criminal Case","Writ Petition"]};
function updateCaseTypes(){let c=document.getElementById('cCourtSelect').value;let t=caseTypeMap[c]||caseTypeMap["default"];let s=document.getElementById('cCaseType');s.innerHTML="";t.forEach(v=>{let o=document.createElement('option');o.value=v;o.text=v;s.appendChild(o);});}

let cases=[{title:"Sh.Dayananda vs State Of Tamil Nadu",court:"Supreme Court of India",sub:"Writ Petition 476/2012 | Diary 33646/2012",jurS:"Delhi",jurD:"Delhi",filing:"9th Oct, 2012",status:"PENDING",prev:"Sep 18, 2026",next:"Oct 5, 2026",tags:["SS"]}];
function render(){let list=document.getElementById('caseList');list.innerHTML="";cases.forEach(c=>{list.innerHTML+=`<div class="case-card"><div style="display:flex;justify-content:space-between"><div style="font-size:14.5px;font-weight:600;color:#1d4ed8;max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><input type="checkbox" style="margin-right:8px"> ${c.title}</div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:11px;color:#64748b">Filing: ${c.filing}</span><span class="badge ${c.status.toLowerCase()}">${c.status}</span></div></div><div style="font-size:11.5px;color:#64748b;margin-top:8px">${c.court}<br>${c.sub}</div></div>`;});document.getElementById('total').innerText=cases.length+315;}
render();
function openModal(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}

function saveCase(){
  let cnr=document.getElementById('cNo').value;
  let court=document.getElementById('cCourtSelect').value||"Supreme Court of India";
  let type=document.getElementById('cCaseType').value;
  let title=document.getElementById('cClient').value|| (cnr?cnr+" vs State":type);
  let diary=document.getElementById('cDiary').value;

  // NAYA LINK SE POST - ab ye wala use hoga
  if(cnr){
    fetch(GOOGLE_SHEET_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({
      cnr:cnr, court:court, caseType:type, title:title, diary:diary,
      judge:document.getElementById('cJudge').value,
      date:document.getElementById('cDate').value
    })});
  }
  cases.unshift({title:title,court:court,sub:type+" | Diary "+diary,jurS:"Delhi",jurD:"Delhi",filing:new Date().toLocaleDateString(),status:"PENDING",prev:"-",next:document.getElementById('cDate').value||"Oct 5, 2026",tags:["SS"]});
  render();closeModal();
}

let currentCaptcha="";
function generateCaptcha(){
  let cnr=document.getElementById('cNo').value.trim();
  if(!cnr){alert('Pehle CNR daalo bhai');return}
  document.getElementById('captchaBox').style.display='block';
  let canvas=document.getElementById('captchaCanvas');
  let ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,180,48);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,180,48);
  currentCaptcha=Math.floor(1000+Math.random()*9000).toString();
  ctx.font='bold 28px Inter';ctx.fillStyle='#0f172a';ctx.fillText(currentCaptcha,40,34);
  for(let i=0;i<4;i++){ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(Math.random()*180,Math.random()*48);ctx.lineTo(Math.random()*180,Math.random()*48);ctx.stroke();}
  document.getElementById('fetchStatus').innerText='Code bharo 👇';
}

function verifyCaptcha(){
  let e=document.getElementById('captchaInput').value.trim();
  if(e===currentCaptcha){
    document.getElementById('fetchStatus').innerText='✅ Verified - Naye link se data la raha hu...';
    // NAYA DEV LINK SE FETCH
    fetch(GOOGLE_SHEET_URL + "?cnr=" + encodeURIComponent(document.getElementById('cNo').value))
     .then(r => r.json())
     .then(data => {
        console.log("New API Data:", data);
        if(data.title) document.getElementById('cClient').value = data.title;
        if(data.court) document.getElementById('cCourtSelect').value = data.court;
        if(data.diary) document.getElementById('cDiary').value = data.diary;
        if(data.judge) document.getElementById('cJudge').value = data.judge;
        if(data.nextDate) document.getElementById('cDate').value = data.nextDate;
        document.getElementById('fetchStatus').innerText='✅ Data aa gaya! (' + (data.cnr_received || data.message || '') + ')';
      })
     .catch(err => {
        console.log(err);
        document.getElementById('fetchStatus').innerText='⚠️ Sheet me nahi mila, manual bharo';
        document.getElementById('cClient').value=document.getElementById('cNo').value+" vs State";
      });
    document.getElementById('captchaBox').style.display='none';
  }else{alert('Galat Captcha');generateCaptcha();}
}
</script>
</body>
</html>
