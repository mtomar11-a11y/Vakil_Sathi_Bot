<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#eef2ff;padding:12px}
.nav{backdrop-filter:blur(20px);background:rgba(255,255,255,0.9);border-radius:18px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.08);border:1px solid rgba(255,255,255,0.6)}
.hero{background:linear-gradient(135deg,#0b5bff 0%,#7c3aed 100%);border-radius:18px;padding:24px;color:#fff;margin:14px 0;box-shadow:0 16px 40px rgba(11,91,255,0.35);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,0.2),transparent 70%);border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,0.06);border:1px solid #f1f5f9;transition:0.3s}
.stat:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(0,0,0,0.1)}
.stat h2{font-size:28px;color:#0b5bff;font-weight:800}
.stat p{font-size:12px;color:#64748b;font-weight:600;margin-top:2px}
.main{display:grid;grid-template-columns:360px 1fr;gap:14px}
@media(max-width:1024px){.main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,0.06);border:1px solid #f1f5f9}
.input{width:100%;padding:12px 14px;border:2px solid #f1f5f9;border-radius:12px;outline:none;margin-bottom:10px;transition:0.2s;background:#fbfdff}
.input:focus{border-color:#0b5bff;background:#fff;box-shadow:0 0 0 3px rgba(11,91,255,0.1)}
.btn{width:100%;padding:12px;background:linear-gradient(#1a6bff,#0b5bff);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 8px 16px rgba(11,91,255,0.25)}
.table-wrap{border:1px solid #f1f5f9;border-radius:14px;overflow:hidden;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;padding:10px 12px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase}
td{padding:12px;border-top:1px solid #f1f5f9}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-blue{background:#e0e7ff;color:#4338ca}.b-green{background:#dcfce7;color:#166534}
</style>
</head><body>
<div class="nav"><b style="color:#0b5bff"><i class="fa-solid fa-scale-balanced"></i> VAKIL SATHI</b><button onclick="window.open('https://docs.google.com/spreadsheets/d/1AytArb10KlQq2-RP4PUDdCxS_zvvwPa7_5Pp-0iaNnU/edit')" style="background:#f1f5f9;border:1px solid #e2e8f0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer">Open Sheet</button></div>

<div class="hero"><h2 style="font-weight:800">Case Management OS v4.0 • Ultra Premium</h2><p style="font-size:12px;opacity:0.9;margin-top:6px;word-break:break-all">Sheet: 1AytArb10KlQq2-RP4PUDdCxS_zvvwPa7_5Pp-0iaNnU | Auto Sync ON</p></div>

<div class="stats">
<div class="stat"><h2 id="totalCases">4</h2><p>Total Cases</p></div>
<div class="stat"><h2 id="todayHearing">3</h2><p>Today Hearings</p></div>
<div class="stat"><h2>98%</h2><p>Success Rate</p></div>
<div class="stat"><h2>42</h2><p>Active Clients</p></div>
</div>

<div class="main">
<div>
<div class="card"><h3 style="font-size:15px;margin-bottom:10px"><i class="fa-solid fa-plus" style="color:#0b5bff"></i> Add New Case</h3>
<input class="input" id="cnrInput" placeholder="CNR - SCIN010735182025">
<input class="input" id="titleInput" placeholder="Case Title">
<input class="input" id="courtInput" placeholder="Court">
<input class="input" id="clientInput" placeholder="Client Name">
<button class="btn" onclick="addCase()">Add to Google Sheet</button>
<p id="status" style="text-align:center;margin-top:8px;font-size:13px;font-weight:700"></p>
</div>
</div>
<div>
<div class="card"><h3 style="font-size:15px">All Cases - Live from Sheet</h3><input class="input" id="searchInput" placeholder="Search..." onkeyup="filterTable()" style="margin-top:10px;padding:10px"><div class="table-wrap"><table><thead><tr><th>CNR</th><th>Title</th><th>Date</th><th>Status</th></tr></thead><tbody id="tableBody"></tbody></table></div></div>
</div>
</div>
<script>
const SHEET_ID="1AytArb10KlQq2-RP4PUDdCxS_zvvwPa7_5Pp-0iaNnU";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzlYM3b3rAPqPZ_9Z310pqDWUIf36iMZ9w0Lx739ljL/exec";
const CSV_URL="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv";
function addCase(){
 let cnr=document.getElementById('cnrInput').value.trim(); if(!cnr){alert("CNR dalo");return;}
 document.getElementById('status').innerText="Adding...";
 google.script.run.withSuccessHandler(()=>{document.getElementById('status').innerText="✅ Ho gaya!";document.getElementById('cnrInput').value='';loadCases();}).saveToYourSheet("CNR",cnr,document.getElementById('titleInput').value,document.getElementById('courtInput').value,document.getElementById('clientInput').value);
}
function loadCases(){
 fetch(CSV_URL).then(r=>r.text()).then(t=>{
  let rows=t.split("\n").slice(1).filter(x=>x.trim()!='').reverse();
  document.getElementById('totalCases').innerText=rows.length;
  let tb=document.getElementById('tableBody'); tb.innerHTML='';
  rows.slice(0,50).forEach(r=>{
   let p=r.split(','); let q=p[2]?p[2].replace(/"/g,''):''; let title=p[3]?p[3].replace(/"/g,''):'';
   let d=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
   tb.innerHTML+=`<tr><td><span class="badge b-blue">${q.substring(0,12)}</span></td><td>${title.substring(0,24)}</td><td>${d}</td><td><span class="badge b-green">Active</span></td></tr>`;
  });
 });
}
function filterTable(){let f=document.getElementById('searchInput').value.toUpperCase();let trs=document.getElementById('tableBody').getElementsByTagName('tr');for(let tr of trs){tr.style.display=tr.innerText.toUpperCase().includes(f)?'':'none';}}
loadCases();
</script>
</body></html>
